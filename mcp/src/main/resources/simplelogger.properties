org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.defaultLogLevel=warn
# Expected resource-not-found (-32002) errors are answered on the wire; the SDK logs every
# handler exception at ERROR with a stack trace, so silence only that per-request logger.
org.slf4j.simpleLogger.log.io.modelcontextprotocol.kotlin.sdk.shared.Protocol=off
