# Windows packaging. GitHub Actions (.github/workflows/conveyor.yml) is the
# release path. Signing uses Azure Trusted Signing; the endpoint and profile
# alias are set below. Local az login is enough; CI sets AZURE_CODESIGNING_TOKEN.
# Unsigned local builds need the --key overrides in docs/packaging.md.

include "#!./gradlew -q printConveyorConfig"

app {
  machines = [ windows.amd64 ]

  # Root entropy for update metadata (24 words/timestamp). CI exports SIGNING_KEY;
  # an unset variable leaves this key omitted so local defaults.conf still applies.
  # This is not app.windows.signing-key (Azure Trusted Signing below).
  signing-key = ${?env.SIGNING_KEY}

  fsname = "safedb"
  display-name = "safe-db"
  rdns-name = "com.safedb.app"
  vendor = "safe-db"
  vcs-url = "https://github.com/COBOL-Kid/safe-db"
  updates = background
  site.base-url = "https://storage.googleapis.com/safedb-download"
  icons = "packaging/icons/icon-*.png"

  windows {
    exe-installer-basename = "safedb-windows-x64"

    signing-key {
      azure-trusted-signing {
        endpoint = "eus.codesigning.azure.net"
        api-access-token = ${?env.AZURE_CODESIGNING_TOKEN}
      }
    }
    signing-key-alias = "safe-db/safe-db"

    package-extras += "packaging/resources/common/trust-profiles" -> trust-profiles
    package-extras += "packaging/resources/windows/Launch-SafeDbManaged.ps1"
  }
}

conveyor.compatibility-level = 22
