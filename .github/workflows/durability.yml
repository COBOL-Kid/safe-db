name: Durability (Scheduled)

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform-check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Fresh Gradle check
        shell: bash
        run: ./gradlew check --rerun-tasks

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SAFEDB_KEYCHAIN_BACKEND: disabled
      SAFEDB_TEST_POSTGRES_HOST: 127.0.0.1
      SAFEDB_TEST_POSTGRES_USER: postgres
      SAFEDB_TEST_POSTGRES_PASSWORD: postgres
      SAFEDB_TEST_POSTGRES_DATABASE: safedb_test
      SAFEDB_TEST_REQUIRE_POSTGRES: "true"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safedb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d safedb_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Seed PostgreSQL fixture
        run: docker exec -i -e PGPASSWORD=postgres "${{ job.services.postgres.id }}" psql -U postgres -d safedb_test -v ON_ERROR_STOP=1 < testdata_postgres.sql
      - name: Run required PostgreSQL integration tests
        run: ./gradlew integrationTest --stacktrace --rerun-tasks
      - name: Upload PostgreSQL reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-integration-reports
          retention-days: 14
          path: |
            shared/build/reports/tests/integrationTest/
            shared/build/test-results/integrationTest/

  mysql-generated-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SAFEDB_KEYCHAIN_BACKEND: disabled
      SAFEDB_TEST_MYSQL_HOST: 127.0.0.1
      SAFEDB_TEST_MYSQL_USER: root
      SAFEDB_TEST_MYSQL_PASSWORD: ""
      SAFEDB_TEST_MYSQL_DATABASE: safedb_test
      SAFEDB_TEST_REQUIRE_MYSQL: "true"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: safedb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Seed generated MySQL fixture
        env:
          SAFEDB_TEST_MYSQL_DOCKER: ${{ job.services.mysql.id }}
        run: ./scripts/seed_mysql.sh --categories 2 --products 12 --customers 30 --orders 100 --batch-size 25 --seed 7
      - name: Run required MySQL integration tests
        run: ./gradlew integrationTest --stacktrace --rerun-tasks
      - name: Upload MySQL reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mysql-generated-integration-reports
          retention-days: 14
          path: |
            shared/build/reports/tests/integrationTest/
            shared/build/test-results/integrationTest/

  ui-tooling-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Install preview and packaging tools
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick fakeroot rpm
      - name: Verify seeder command surface
        shell: bash
        run: |
          bash -n scripts/seed_mysql.sh
          ./scripts/seed_mysql.sh --help
          if ./scripts/seed_mysql.sh --orders nope; then
            echo "expected invalid seeder arguments to fail" >&2
            exit 1
          fi
      - name: Render and validate previews
        shell: bash
        run: |
          rm -rf /tmp/safedb-preview
          xvfb-run -a ./gradlew renderPreview --rerun-tasks
          test "$(find /tmp/safedb-preview -name '*.png' -type f -size +0c | wc -l | tr -d ' ')" = "14"
          for image in /tmp/safedb-preview/{home,connections,builder,builder-collapsed,history}-{light,dark}.png; do
            test "$(identify -format '%wx%h' "$image")" = "1280x832"
          done
          for image in /tmp/safedb-preview/{explore,explore-pivot}-{light,dark}.png; do
            test "$(identify -format '%wx%h' "$image")" = "1120x760"
          done
      - name: Build current-OS distribution
        run: ./gradlew packageDistributionForCurrentOS
      - name: Upload preview renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-renders
          retention-days: 14
          path: /tmp/safedb-preview/*.png
      - name: Upload packaging reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaging-reports
          retention-days: 14
          path: build/compose/logs/
