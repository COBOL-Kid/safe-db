name: Durability (On demand)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform-check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Fresh Gradle check
        shell: bash
        run: ./gradlew check --rerun-tasks

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SAFEDB_KEYCHAIN_BACKEND: disabled
      SAFEDB_TEST_POSTGRES_HOST: 127.0.0.1
      SAFEDB_TEST_POSTGRES_USER: postgres
      SAFEDB_TEST_POSTGRES_PASSWORD: postgres
      SAFEDB_TEST_POSTGRES_DATABASE: safedb_test
      SAFEDB_TEST_REQUIRE_POSTGRES: "true"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safedb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d safedb_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Seed PostgreSQL fixture
        run: docker exec -i -e PGPASSWORD=postgres "${{ job.services.postgres.id }}" psql -U postgres -d safedb_test -v ON_ERROR_STOP=1 < testdata_postgres.sql
      - name: Run required PostgreSQL integration tests
        run: ./gradlew integrationTest --stacktrace --rerun-tasks
      - name: Upload PostgreSQL reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-integration-reports
          retention-days: 14
          path: |
            shared/build/reports/tests/integrationTest/
            shared/build/test-results/integrationTest/

  mysql-generated-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SAFEDB_KEYCHAIN_BACKEND: disabled
      SAFEDB_TEST_MYSQL_HOST: 127.0.0.1
      SAFEDB_TEST_MYSQL_USER: root
      SAFEDB_TEST_MYSQL_PASSWORD: ""
      SAFEDB_TEST_MYSQL_DATABASE: safedb_test
      SAFEDB_TEST_REQUIRE_MYSQL: "true"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: safedb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Seed generated MySQL fixture
        env:
          SAFEDB_TEST_MYSQL_DOCKER: ${{ job.services.mysql.id }}
        run: ./scripts/seed_mysql.sh --categories 2 --products 12 --customers 30 --orders 100 --batch-size 25 --seed 7
      - name: Run required MySQL integration tests
        run: ./gradlew integrationTest --stacktrace --rerun-tasks
      - name: Upload MySQL reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mysql-generated-integration-reports
          retention-days: 14
          path: |
            shared/build/reports/tests/integrationTest/
            shared/build/test-results/integrationTest/

  ui-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install preview tools
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick
      - name: Verify seeder command surface
        shell: bash
        run: |
          bash -n scripts/seed_mysql.sh
          ./scripts/seed_mysql.sh --help
          if ./scripts/seed_mysql.sh --orders nope; then
            echo "expected invalid seeder arguments to fail" >&2
            exit 1
          fi
      - name: Render and validate previews
        shell: bash
        run: |
          rm -rf /tmp/safedb-preview
          xvfb-run -a ./gradlew renderPreview --rerun-tasks
          test "$(find /tmp/safedb-preview -name '*.png' -type f -size +0c | wc -l | tr -d ' ')" = "44"
          for image in /tmp/safedb-preview/{home,connections,connections-new,connections-edit,builder,builder-collapsed,map,history,sql}-{light,dark}.png; do
            test "$(identify -format '%wx%h' "$image")" = "1280x832"
          done
          for image in /tmp/safedb-preview/connections-new-narrow-{light,dark}.png; do
            test "$(identify -format '%wx%h' "$image")" = "840x900"
          done
          for image in /tmp/safedb-preview/builder-narrow-{light,dark}.png; do
            test "$(identify -format '%wx%h' "$image")" = "960x700"
          done
          for image in /tmp/safedb-preview/{explore,explore-pivot,explore-worksheet,explore-visualization-empty,explore-visualization-bar,explore-visualization-horizontal,explore-visualization-line,explore-visualization-scatter,explore-visualization-kpi,explore-visualization-histogram,explore-recipes}-{light,dark}.png; do
            test "$(identify -format '%wx%h' "$image")" = "1120x760"
          done
      - name: Upload preview renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-renders
          retention-days: 14
          path: /tmp/safedb-preview/*.png

  native-package:
    name: Package (${{ matrix.package_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package_name: DMG
            output_dir: build/compose/binaries/main/dmg
            extension: dmg
            log_suffix: macos
          - os: windows-latest
            package_name: MSI
            output_dir: build/compose/binaries/main/msi
            extension: msi
            log_suffix: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build ${{ matrix.package_name }} distribution
        shell: bash
        run: ./gradlew packageDistributionForCurrentOS --stacktrace
      - name: Verify ${{ matrix.package_name }} installer
        shell: bash
        env:
          INSTALLER_DIRECTORY: ${{ matrix.output_dir }}
          INSTALLER_EXTENSION: ${{ matrix.extension }}
        run: |
          installer="$(find "$INSTALLER_DIRECTORY" -maxdepth 1 -type f -name "*.$INSTALLER_EXTENSION" -size +0c -print -quit 2>/dev/null || true)"
          if [ -z "$installer" ]; then
            echo "Expected a nonempty .$INSTALLER_EXTENSION installer in $INSTALLER_DIRECTORY" >&2
            find build/compose -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          echo "Verified nonempty installer: $installer"
      - name: Upload packaging logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaging-logs-${{ matrix.log_suffix }}
          retention-days: 14
          path: build/compose/logs/
          if-no-files-found: ignore
