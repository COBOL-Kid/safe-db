name: conveyor

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Windows site to gs://safedb-download
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: conveyor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: conveyor
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Assemble the application jar
        run: ./gradlew jar --stacktrace

      - name: Log in to Azure
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Mint Azure Trusted Signing token
        run: |
          set -euo pipefail
          token="$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)"
          echo "::add-mask::$token"
          echo "AZURE_CODESIGNING_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Build the Windows site
        uses: hydraulic-software/conveyor/actions/build@0bb33f7c91992f451c02afb714d9bbc551e0cdfa # v22.2
        with:
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          agree_to_license: '1'
          conveyor_version: '22.2'
          command: make site
          extra_flags: '--console=plain --parallelism=2'

      - name: Assert site outputs
        run: |
          set -euo pipefail
          shopt -s nullglob
          test -s output/safedb-windows-x64.exe
          test -s output/safedb.appinstaller
          test -s output/metadata.properties
          msix=(output/*.msix)
          if [[ ${#msix[@]} -eq 0 ]]; then
            echo "expected a nonempty .msix in output/" >&2
            ls -la output || true
            exit 1
          fi
          for f in "${msix[@]}"; do
            test -s "$f"
          done
          ls -l output

      - name: Upload Conveyor site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conveyor-site
          retention-days: 14
          path: output
          if-no-files-found: error

  publish:
    needs: package
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: conveyor
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conveyor-site
          path: output

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Publish to Cloud Storage
        run: ./scripts/publish-release.sh ./output
