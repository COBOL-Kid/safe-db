name: conveyor

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Windows site to gs://safedb-download
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: conveyor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Gradle check
        run: ./gradlew check

      - name: Upload unit test and coverage reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conveyor-unit-and-coverage-reports
          retention-days: 7
          path: |
            build/reports/tests/test/
            build/test-results/test/
            shared/build/reports/tests/test/
            shared/build/test-results/test/
            mcp/build/reports/tests/test/
            mcp/build/test-results/test/
            build/reports/kover/

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SAFEDB_KEYCHAIN_BACKEND: disabled
      SAFEDB_TEST_MYSQL_HOST: 127.0.0.1
      SAFEDB_TEST_MYSQL_USER: root
      SAFEDB_TEST_MYSQL_PASSWORD: ""
      SAFEDB_TEST_MYSQL_DATABASE: safedb_test
      SAFEDB_TEST_REQUIRE_MYSQL: "true"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: safedb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Seed static MySQL fixture
        env:
          SAFEDB_TEST_MYSQL_DOCKER: ${{ job.services.mysql.id }}
        run: ./scripts/seed_mysql.sh --static

      - name: Gradle integrationTest
        run: ./gradlew integrationTest --stacktrace

      - name: Upload integration test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conveyor-integration-test-reports
          retention-days: 7
          path: |
            shared/build/reports/tests/integrationTest/
            shared/build/test-results/integrationTest/
            mcp/build/reports/tests/integrationTest/
            mcp/build/test-results/integrationTest/

  package:
    needs: [test, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: conveyor
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Assemble the application jar
        run: ./gradlew jar --stacktrace

      - name: Log in to Azure
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Mint Azure Trusted Signing token
        run: |
          set -euo pipefail
          token="$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)"
          echo "::add-mask::$token"
          echo "AZURE_CODESIGNING_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Build the Windows site
        uses: hydraulic-software/conveyor/actions/build@0bb33f7c91992f451c02afb714d9bbc551e0cdfa # v22.2
        with:
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          agree_to_license: '1'
          conveyor_version: '22.2'
          command: make site
          extra_flags: '--console=plain --parallelism=2'

      - name: Assert site outputs
        run: ./scripts/assert-conveyor-site.sh ./output

      - name: Upload Conveyor site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conveyor-site
          retention-days: 14
          path: output
          if-no-files-found: error

  smoke:
    name: Smoke (windows Authenticode)
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conveyor-site
          path: output

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $output = Join-Path (Get-Location) "output"
          $exe = Join-Path $output "safedb-windows-x64.exe"
          $msixFiles = @(Get-ChildItem -LiteralPath $output -File -Filter "*.msix" -ErrorAction SilentlyContinue)
          if ($msixFiles.Count -ne 1) {
            throw "expected exactly one .msix in output, found $($msixFiles.Count)"
          }
          foreach ($path in @($exe, $msixFiles[0].FullName)) {
            if (-not (Test-Path -LiteralPath $path) -or (Get-Item -LiteralPath $path).Length -le 0) {
              throw "expected nonempty $path"
            }
            $sig = Get-AuthenticodeSignature -LiteralPath $path
            Write-Host "$([IO.Path]::GetFileName($path)) Status=$($sig.Status) Subject=$($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid" -or -not $sig.SignerCertificate) {
              throw "$path Authenticode status $($sig.Status): $($sig.StatusMessage)"
            }
          }

  publish:
    needs: [package, smoke]
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: conveyor
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conveyor-site
          path: output

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Publish to Cloud Storage
        run: ./scripts/publish-release.sh ./output
