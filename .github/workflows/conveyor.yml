name: conveyor

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Windows site to gs://safedb-download
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: conveyor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: conveyor
    env:
      CONVEYOR_VERSION: '22.2'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Assemble the application jar
        run: ./gradlew jar --stacktrace

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Mint Azure Trusted Signing token
        run: |
          set -euo pipefail
          token="$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)"
          echo "::add-mask::$token"
          echo "AZURE_CODESIGNING_TOKEN=$token" >> "$GITHUB_ENV"

      # hydraulic-software/conveyor/actions/build is a composite action whose
      # nested uses: actions/cache@v4 and actions/upload-artifact@v4 are not
      # SHA-pinned, so org policy rejects them. Install and run Conveyor here.
      - name: Cache Conveyor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .conveyor
          key: conveyor-${{ env.CONVEYOR_VERSION }}-${{ github.run_id }}
          restore-keys: |
            conveyor-${{ env.CONVEYOR_VERSION }}-

      - name: Install Conveyor
        run: |
          set -euo pipefail
          install_dir=".conveyor/install/conveyor-${CONVEYOR_VERSION}"
          if [ ! -d "$install_dir" ]; then
            archive="conveyor-${CONVEYOR_VERSION}-linux-amd64.tar.gz"
            curl -fsSL "https://downloads.hydraulic.dev/conveyor/${archive}" -o "${archive}"
            mkdir -p .conveyor/install
            tar xzf "${archive}" -C .conveyor/install
            rm -f "${archive}"
          fi

      - name: Build the Windows site
        env:
          CONVEYOR_AGREE_TO_LICENSE: '1'
          SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          # Empty when unset: Linux still needs --passphrase so it does not prompt.
          CONVEYOR_PASS: ${{ secrets.CONVEYOR_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY}" ]; then
            echo "Missing CONVEYOR_SIGNING_KEY" >&2
            exit 1
          fi
          # Conveyor wants the unquoted 24-word root key, not -K (spaces break HOCON)
          # and not a pasted defaults.conf line / keyring / Azure alias.
          key="${SIGNING_KEY//$'\r'/}"
          key="${key#"${key%%[![:space:]]*}"}"
          key="${key%"${key##*[![:space:]]}"}"
          if [[ "${key}" == app.signing-key* ]]; then
            key="${key#app.signing-key}"
            key="${key#"${key%%[![:space:]]*}"}"
            key="${key#=}"
            key="${key#"${key%%[![:space:]]*}"}"
          fi
          if [[ "${#key}" -ge 2 && "${key:0:1}" == '"' && "${key: -1}" == '"' ]]; then
            key="${key:1:-1}"
          elif [[ "${#key}" -ge 2 && "${key:0:1}" == "'" && "${key: -1}" == "'" ]]; then
            key="${key:1:-1}"
          fi
          key="$(printf '%s' "${key}" | tr -s '[:space:]' ' ')"
          key="${key#"${key%%[![:space:]]*}"}"
          key="${key%"${key##*[![:space:]]}"}"
          key="${key// \/ /\/}"
          if [ "${key}" = "keyring" ]; then
            echo "CONVEYOR_SIGNING_KEY is the keyring placeholder." >&2
            echo "Paste the 24-word root key (words immediately followed by / and a UTC timestamp)." >&2
            exit 1
          fi
          if [[ ! "${key}" =~ ^[a-z]+(\ [a-z]+)+/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$ ]]; then
            echo "CONVEYOR_SIGNING_KEY is not a Conveyor root key." >&2
            echo "Expected dictionary words immediately followed by / and a UTC timestamp," >&2
            echo "copied from defaults.conf or Keychain Access (Hydraulic Conveyor Root Key)." >&2
            echo "Do not use the Azure alias (account/profile), a PEM, keyring, or the quoted assignment line." >&2
            exit 1
          fi
          export SIGNING_KEY="${key}"
          export CONVEYOR_PASS="${CONVEYOR_PASS-}"
          export PATH="${PATH}:${GITHUB_WORKSPACE}/.conveyor/install/conveyor-${CONVEYOR_VERSION}/bin"
          # --console=plain has no TTY. Linux encrypts the root key and will
          # otherwise stop with "To enter a passphrase you must have an attached
          # console." Empty CONVEYOR_PASS is the same as pressing Enter locally.
          conveyor --cache-dir="${GITHUB_WORKSPACE}/.conveyor/cache" --console=plain --passphrase "env:CONVEYOR_PASS" --parallelism=2 make site

      - name: Upload Conveyor log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conveyor-log-package
          path: ~/.cache/hydraulic/conveyor/logs/log.latest.txt
          if-no-files-found: ignore

      - name: Assert site outputs
        run: ./scripts/assert-conveyor-site.sh ./output

      - name: Upload Conveyor site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conveyor-site
          retention-days: 14
          path: output
          if-no-files-found: error

  smoke:
    name: Smoke (windows Authenticode)
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conveyor-site
          path: output

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $output = Join-Path (Get-Location) "output"
          $exe = Join-Path $output "safedb-windows-x64.exe"
          $msixFiles = @(Get-ChildItem -LiteralPath $output -File -Filter "*.msix" -ErrorAction SilentlyContinue)
          if ($msixFiles.Count -ne 1) {
            throw "expected exactly one .msix in output, found $($msixFiles.Count)"
          }
          foreach ($path in @($exe, $msixFiles[0].FullName)) {
            if (-not (Test-Path -LiteralPath $path) -or (Get-Item -LiteralPath $path).Length -le 0) {
              throw "expected nonempty $path"
            }
            $sig = Get-AuthenticodeSignature -LiteralPath $path
            Write-Host "$([IO.Path]::GetFileName($path)) Status=$($sig.Status) Subject=$($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid" -or -not $sig.SignerCertificate) {
              throw "$path Authenticode status $($sig.Status): $($sig.StatusMessage)"
            }
          }

  publish:
    needs: [package, smoke]
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: conveyor
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conveyor-site
          path: output

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Publish to Cloud Storage
        run: ./scripts/publish-release.sh ./output
