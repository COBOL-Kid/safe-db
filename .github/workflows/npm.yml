name: npm

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packed tarballs to npm
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SAFEDB_KEYCHAIN_BACKEND: disabled
      SAFEDB_TEST_MYSQL_HOST: 127.0.0.1
      SAFEDB_TEST_MYSQL_USER: root
      SAFEDB_TEST_MYSQL_PASSWORD: ""
      SAFEDB_TEST_MYSQL_DATABASE: safedb_test
      SAFEDB_TEST_REQUIRE_MYSQL: "true"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: safedb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Seed static MySQL fixture
        env:
          SAFEDB_TEST_MYSQL_DOCKER: ${{ job.services.mysql.id }}
        run: ./scripts/seed_mysql.sh --static

      - name: Assemble npm packages and test the Linux jlink image
        run: ./gradlew :mcp:assembleNpmAllPlatforms :mcp:npmCliTest :mcp:verifyNpmPackagedTest --stacktrace

      - name: Pack npm tarballs
        run: |
          set -euo pipefail
          mkdir -p mcp/build/npm-tarballs
          for dir in mcp/build/npm-all/@safe-db/*; do
            npm pack --pack-destination "$PWD/mcp/build/npm-tarballs" --silent "$dir"
          done
          ls -l mcp/build/npm-tarballs

      - name: Upload npm tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          retention-days: 14
          path: mcp/build/npm-tarballs/*.tgz

  smoke:
    name: Smoke (${{ matrix.package }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: darwin-arm64
          - os: windows-latest
            package: win32-x64
          - os: ubuntu-24.04-arm
            package: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: tarballs

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install packed packages and verify CLI and stdio MCP handshake
        shell: bash
        run: |
          set -euo pipefail
          meta="$(ls tarballs/safe-db-mcp-[0-9]*.tgz)"
          platform="$(ls tarballs/safe-db-mcp-${{ matrix.package }}-*.tgz)"
          mkdir install
          cd install
          npm init -y >/dev/null
          npm install "../$meta" "../$platform"
          npx --no-install safe-db-mcp --help
          node - <<'EOF'
          const { spawn } = require('child_process');
          const assert = require('assert');

          const child = spawn('npx', ['--no-install', 'safe-db-mcp'], {
            shell: process.platform === 'win32',
            stdio: ['pipe', 'pipe', 'pipe'],
          });

          let stdoutBuf = '';
          let stderr = '';
          let stage = 'init';
          let settled = false;

          const finish = (err) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            if (err) {
              child.kill();
              console.error('MCP smoke handshake failed:', err.message);
              if (stderr) console.error('stderr:\n' + stderr);
              process.exit(1);
            }
          };

          const timer = setTimeout(() => {
            finish(new Error(`Timed out after 30s at stage=${stage}`));
          }, 30000);

          child.stderr.on('data', (chunk) => {
            stderr += chunk.toString('utf8');
          });

          child.stdout.on('data', (chunk) => {
            stdoutBuf += chunk.toString('utf8');
            const lines = stdoutBuf.split(/\r?\n/);
            stdoutBuf = lines.pop() ?? '';
            for (const raw of lines) {
              const line = raw.trim();
              if (!line) continue;
              let msg;
              try {
                msg = JSON.parse(line);
              } catch (e) {
                return finish(new Error(`Non-JSON line on stdout: ${line}`));
              }
              assert.strictEqual(msg.jsonrpc, '2.0', `Unexpected jsonrpc field: ${line}`);
              if (msg.id === 1 && stage === 'init') {
                assert(msg.result && msg.result.protocolVersion, `Missing protocolVersion: ${line}`);
                assert(msg.result.serverInfo && msg.result.serverInfo.name === 'safe-db', `Unexpected serverInfo: ${line}`);
                assert(msg.result.serverInfo.version, `Missing serverInfo.version: ${line}`);
                stage = 'tools';
                child.stdin.write(JSON.stringify({ jsonrpc: '2.0', method: 'notifications/initialized' }) + '\n');
                child.stdin.write(JSON.stringify({ jsonrpc: '2.0', id: 2, method: 'tools/list' }) + '\n');
              } else if (msg.id === 2 && stage === 'tools') {
                assert(msg.result && Array.isArray(msg.result.tools), `Missing tools array: ${line}`);
                const names = new Set(msg.result.tools.map((t) => t.name));
                for (const required of ['list_connections', 'list_tables', 'describe_table', 'run_query', 'assess_query', 'export_result', 'delete_connection']) {
                  assert(names.has(required), `Missing tool ${required} in tools/list`);
                }
                stage = 'closing';
                child.stdin.end();
              }
            }
          });

          child.on('error', (err) => finish(err));
          child.on('close', (code, signal) => {
            if (settled) return;
            if (stage !== 'closing') {
              return finish(new Error(`Exited early at stage=${stage} code=${code} signal=${signal}`));
            }
            if (code !== 0 || signal !== null) {
              return finish(new Error(`Nonzero exit code=${code} signal=${signal}`));
            }
            clearTimeout(timer);
            settled = true;
            console.log('MCP stdio JSON-RPC smoke handshake OK');
          });

          child.stdin.write(JSON.stringify({
            jsonrpc: '2.0',
            id: 1,
            method: 'initialize',
            params: { protocolVersion: '2024-11-05', capabilities: {}, clientInfo: { name: 'ci-smoke', version: '0' } },
          }) + '\n');
          EOF

  publish:
    needs: [pack, smoke]
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: tarballs

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish to npm
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd tarballs
          darwin=(safe-db-mcp-darwin-arm64-*.tgz)
          linux_arm=(safe-db-mcp-linux-arm64-*.tgz)
          linux_x64=(safe-db-mcp-linux-x64-*.tgz)
          win=(safe-db-mcp-win32-x64-*.tgz)
          meta=(safe-db-mcp-[0-9]*.tgz)
          if [[ ${#darwin[@]} -ne 1 || ${#linux_arm[@]} -ne 1 || ${#linux_x64[@]} -ne 1 || ${#win[@]} -ne 1 || ${#meta[@]} -ne 1 ]]; then
            echo "expected 4 platform tarballs + 1 meta; got:" >&2
            ls -l
            exit 1
          fi
          # Safe to re-run: versions already on the registry are skipped. The check also
          # runs after a failed attempt because a transient provenance (Sigstore) error
          # can leave the package published or let a retry succeed.
          publish_tarball() {
            local tarball="$1" spec attempt
            spec="$(tar -xOzf "$tarball" package/package.json | node -e 'const p=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(p.name+"@"+p.version)')"
            for attempt in 1 2 3; do
              if npm view "$spec" version >/dev/null 2>&1; then
                echo "$spec is already published; skipping"
                return 0
              fi
              if npm publish "$tarball" --access public --provenance; then
                return 0
              fi
              echo "Publishing $spec failed (attempt $attempt of 3)" >&2
              sleep $((attempt * 15))
            done
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is published despite the reported failure"
              return 0
            fi
            return 1
          }
          publish_tarball "${darwin[0]}"
          publish_tarball "${linux_arm[0]}"
          publish_tarball "${linux_x64[0]}"
          publish_tarball "${win[0]}"
          publish_tarball "${meta[0]}"
