name: npm

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packed tarballs to npm
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SAFEDB_KEYCHAIN_BACKEND: disabled
      SAFEDB_TEST_MYSQL_HOST: 127.0.0.1
      SAFEDB_TEST_MYSQL_USER: root
      SAFEDB_TEST_MYSQL_PASSWORD: ""
      SAFEDB_TEST_MYSQL_DATABASE: safedb_test
      SAFEDB_TEST_REQUIRE_MYSQL: "true"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: safedb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Seed static MySQL fixture
        env:
          SAFEDB_TEST_MYSQL_DOCKER: ${{ job.services.mysql.id }}
        run: ./scripts/seed_mysql.sh --static

      - name: Assemble npm packages and test the Linux jlink image
        run: ./gradlew :mcp:assembleNpmAllPlatforms :mcp:npmCliTest :mcp:npmPackagedTest --stacktrace

      - name: Pack npm tarballs
        run: |
          set -euo pipefail
          mkdir -p mcp/build/npm-tarballs
          for dir in mcp/build/npm-all/@safe-db/*; do
            npm pack --pack-destination "$PWD/mcp/build/npm-tarballs" --silent "$dir"
          done
          ls -l mcp/build/npm-tarballs

      - name: Upload npm tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          retention-days: 14
          path: mcp/build/npm-tarballs/*.tgz

  smoke:
    name: Smoke (${{ matrix.package }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: darwin-arm64
          - os: windows-latest
            package: win32-x64
          - os: ubuntu-24.04-arm
            package: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: tarballs

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install packed packages and print usage
        shell: bash
        run: |
          set -euo pipefail
          meta="$(ls tarballs/safe-db-mcp-[0-9]*.tgz)"
          platform="$(ls tarballs/safe-db-mcp-${{ matrix.package }}-*.tgz)"
          mkdir install
          cd install
          npm init -y >/dev/null
          npm install "../$meta" "../$platform"
          npx safe-db-mcp --help

  publish:
    needs: [pack, smoke]
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: tarballs

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish to npm
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd tarballs
          darwin=(safe-db-mcp-darwin-arm64-*.tgz)
          linux_arm=(safe-db-mcp-linux-arm64-*.tgz)
          linux_x64=(safe-db-mcp-linux-x64-*.tgz)
          win=(safe-db-mcp-win32-x64-*.tgz)
          meta=(safe-db-mcp-[0-9]*.tgz)
          if [[ ${#darwin[@]} -ne 1 || ${#linux_arm[@]} -ne 1 || ${#linux_x64[@]} -ne 1 || ${#win[@]} -ne 1 || ${#meta[@]} -ne 1 ]]; then
            echo "expected 4 platform tarballs + 1 meta; got:" >&2
            ls -l
            exit 1
          fi
          # Safe to re-run: versions already on the registry are skipped. The check also
          # runs after a failed attempt because a transient provenance (Sigstore) error
          # can leave the package published or let a retry succeed.
          publish_tarball() {
            local tarball="$1" spec attempt
            spec="$(tar -xOzf "$tarball" package/package.json | node -e 'const p=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(p.name+"@"+p.version)')"
            for attempt in 1 2 3; do
              if npm view "$spec" version >/dev/null 2>&1; then
                echo "$spec is already published; skipping"
                return 0
              fi
              if npm publish "$tarball" --access public --provenance; then
                return 0
              fi
              echo "Publishing $spec failed (attempt $attempt of 3)" >&2
              sleep $((attempt * 15))
            done
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is published despite the reported failure"
              return 0
            fi
            return 1
          }
          publish_tarball "${darwin[0]}"
          publish_tarball "${linux_arm[0]}"
          publish_tarball "${linux_x64[0]}"
          publish_tarball "${win[0]}"
          publish_tarball "${meta[0]}"
