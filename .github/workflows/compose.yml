name: Compose (Kotlin)

permissions:
  contents: read

concurrency:
  group: compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/**'
      - 'testdata_mysql.sql'
      - 'testdata_postgres.sql'
      - '.github/workflows/compose.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/**'
      - 'testdata_mysql.sql'
      - 'testdata_postgres.sql'
      - '.github/workflows/compose.yml'
  merge_group:
    types: [checks_requested]

jobs:
  changes:
    # Drafts and unrelated label events do not need a classifier runner.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      (
        github.event.pull_request.draft == false &&
        (github.event.action != 'labeled' || github.event.label.name == 'ci:integration')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      integration: ${{ steps.classify.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: classify
        name: Classify integration-relevant changes
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              ;;
            merge_group)
              base="${{ github.event.merge_group.base_sha }}"
              head="${{ github.event.merge_group.head_sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              ;;
            *)
              echo "Unsupported event: ${{ github.event_name }}" >&2
              exit 1
              ;;
          esac

          changed_files="$RUNNER_TEMP/changed-files.txt"
          if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
            git diff-tree --no-commit-id --name-only -r "$head" > "$changed_files"
          else
            git diff --name-only "$base" "$head" > "$changed_files"
          fi

          integration=false
          while IFS= read -r path; do
            case "$path" in
              shared/*|buildSrc/*|gradle/*|build.gradle.kts|settings.gradle.kts|gradle.properties|gradlew|gradlew.bat|scripts/*|testdata_mysql.sql)
                integration=true
                break
                ;;
            esac
          done < "$changed_files"
          echo "integration=$integration" >> "$GITHUB_OUTPUT"

  test:
    # Label events exist only to opt fork PRs into integration; do not repeat the fast gate.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      (github.event.pull_request.draft == false && github.event.action != 'labeled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Gradle check
        run: ./gradlew check

      - name: Upload unit test and coverage reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-and-coverage-reports
          retention-days: 7
          path: |
            build/reports/tests/test/
            build/test-results/test/
            shared/build/reports/tests/test/
            shared/build/test-results/test/
            build/reports/kover/

  integration:
    # Forks need the exact maintainer label; unrelated label changes must not rerun this job.
    if: >-
      always() &&
      needs.changes.outputs.integration == 'true' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'merge_group' ||
        (
          github.event.pull_request.draft == false &&
          (github.event.action != 'labeled' || github.event.label.name == 'ci:integration') &&
          (
            github.event.pull_request.head.repo.full_name == github.repository ||
            contains(github.event.pull_request.labels.*.name, 'ci:integration')
          )
        )
      )
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SAFEDB_KEYCHAIN_BACKEND: disabled
      SAFEDB_TEST_MYSQL_HOST: 127.0.0.1
      SAFEDB_TEST_MYSQL_USER: root
      SAFEDB_TEST_MYSQL_PASSWORD: ""
      SAFEDB_TEST_MYSQL_DATABASE: safedb_test
      SAFEDB_TEST_REQUIRE_MYSQL: "true"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: safedb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Seed static MySQL fixture
        env:
          SAFEDB_TEST_MYSQL_DOCKER: ${{ job.services.mysql.id }}
        run: ./scripts/seed_mysql.sh --static

      - name: Gradle integrationTest
        run: ./gradlew integrationTest --stacktrace

      - name: Upload integration test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-reports
          retention-days: 7
          path: |
            shared/build/reports/tests/integrationTest/
            shared/build/test-results/integrationTest/
