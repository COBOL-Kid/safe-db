name: Compose (Kotlin)

permissions:
  contents: read

concurrency:
  group: compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/**'
      - 'testdata_mysql.sql'
      - 'testdata_postgres.sql'
      - '.github/workflows/compose.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/**'
      - 'testdata_mysql.sql'
      - 'testdata_postgres.sql'
      - '.github/workflows/compose.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Gradle check
        run: ./gradlew check koverXmlReport koverHtmlReport koverVerify

      - name: Upload unit test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-and-coverage-reports
          retention-days: 14
          path: |
            build/reports/tests/test/
            build/test-results/test/
            shared/build/reports/tests/jvmTest/
            shared/build/test-results/jvmTest/
            build/reports/kover/

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SAFEDB_KEYCHAIN_BACKEND: disabled
      SAFEDB_TEST_MYSQL_HOST: 127.0.0.1
      SAFEDB_TEST_MYSQL_USER: root
      SAFEDB_TEST_MYSQL_PASSWORD: ""
      SAFEDB_TEST_MYSQL_DATABASE: safedb_test
      SAFEDB_TEST_REQUIRE_MYSQL: "true"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: safedb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Seed static MySQL fixture
        run: ./scripts/seed_mysql.sh --static

      - name: Gradle integrationTest
        run: ./gradlew integrationTest --stacktrace

      - name: Upload integration test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: |
            shared/build/reports/tests/integrationTest/
            shared/build/test-results/integrationTest/
