name: Compose (Kotlin)

on:
  push:
    branches: [main]
    paths:
      - 'compose-app/**'
      - '.github/workflows/compose.yml'
  pull_request:
    paths:
      - 'compose-app/**'
      - '.github/workflows/compose.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle check
        working-directory: compose-app
        run: ./gradlew check
