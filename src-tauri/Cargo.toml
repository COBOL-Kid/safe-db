[package]
name = "safe-db"
version = "0.1.0"
description = "Safely explore production databases with non-locking reads and enforced best practices"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.96.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "safe_db_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2.8.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "mysql"] }
keyring-core = "1.0.0"
uuid = { version = "1.23.3", features = ["v4"] }
anyhow = "1.0.102"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net"] }
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "tokio"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
oracle = { version = "0.6.3", optional = true }
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"

[features]
default = []
oracle = ["dep:oracle"]
test-helpers = []

[dev-dependencies]
safe-db = { path = ".", features = ["test-helpers"] }
