[package]
name = "safe-db"
version = "0.1.0"
description = "Safely explore production databases with non-locking reads and enforced best practices"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "safe_db_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "mysql"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native", "crypto-rust"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "tokio"] }
tokio-util = { version = "0.7", features = ["compat"] }
oracle = { version = "0.6", optional = true }

[features]
default = []
oracle = ["dep:oracle"]
